<!DOCTYPE html>
<html>
  <head>
    <title>Grid Prictice </title>
  </head>
  <body>  
    <div style="
      display: grid;
      grid-template-columns: 100px 100px ;
      margin-top: 30px;
      ">

<div style="background-color: lightblue;">div 1</div>
<div style="background-color: lightpink;">div 1<p>text</p></div>



    </div>

 
    
    <div style="
      display: grid;
      grid-template-columns: 100px 100px 200px ;
      margin-top: 30px;
      ">

<div style="background-color: lightblue;">div 1</div>
<div style="background-color: lightpink;">div 1<p>text</p></div>
<div style="background-color: lightblue;">div 3</div>
<div style="background-color: lightpink;">100px</div>
    </div>


    <div style="
      display: grid;
      grid-template-columns: 100px 1fr;

      ">

<div style="background-color: lightblue;">div 1</div>
<div style="background-color: lightpink;">div 1</div>
    </div>

      display: grid;
      grid-template-columns: 100px 1fr 2fr;

      ">

<div style="background-color: lightblue;">div 1</div>
<div style="background-color: lightpink;">div 1</div>
<div style="background-color: lightblue;">div 1</div>
    </div>


    <div style="
      display: grid;
      grid-template-columns: 100px 1fr;

      ">

<div style="background-color: lightblue;">div 1</div>
<div style="background-color: lightpink;">div 1</div>
    </div>



    <div style="
      display: grid;
      column-gap: 20px;
      row-gap:50px;
      ">
    <div style="
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      margin-top: 30px;
      column-gap: 20px;
      row-gap: 50px;">

<div style="background-color: lightblue; height: 200px;">div 1</div>

    </div>

    <div style="
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;

      row-gap:50px;
      ">

<div style="background-color: lightblue; height: 200px;">div 1</div>
<div style="background-color: lightpink; height: 200px;">div 2</div>
<div style="background-color: lightblue; height: 200px;">div 3</div>

</html>
