<head>
  
  <title>Cart Quantity</title>
</head>

<body>
  
<button onclick="

 console.log(`Cart Quantity:${cartQuantity}`);
 ">Show Quantity</button>

 <button onclick="
 updateCartQuantity(1,'+');

"
 >Add to cart</button>

<button onclick="
  updateCartQuantity(2,'+');"
 >+2</button>

 <button onclick="
  
 updateCartQuantity(3,'+');

"
 >+3</button>
<button onclick="
 
 updateCartQuantity(4,'+');

"
 >+4</button>

 <button onclick="
  
 updateCartQuantity(5,'+');

"
 >+5</button>

 
 <button onclick="
 updateCartQuantity(1,'-');
 ">Remove from cart</button>

 <button onclick="
 updateCartQuantity(1,'-');">-2</button>

 <button onclick="
 updateCartQuantity(1,'-');"
 >-3</button>

 <button onclick="cartQuantity=0;
 console.log('Cart was reset');
 console.log(`Cart Quantity:${cartQuantity}`);
 ">Reset</button>
  <script>
    
    let cartQuantity=0;
    let maximumQuantity=10;
   
    
    function updateCartQuantity(cartsN,todo){
    
      if(todo==='+'){
    if( cartQuantity<maximumQuantity){
      cartQuantity+=cartsN;
    }
    else if(cartQuantity>=maximumQuantity){
       alert('The cart is full');
     return;
      }
    }
 

      if(todo==='-') {
       if((cartQuantity-1)>0){
      cartQuantity-=cartsN;
      } 
      else if((cartQuantity-1)<=0){
       alert('Not enough items in cart.');
       return;
      }
      }
    console.log(`Cart Quantity:${cartQuantity}`);
  } 
  

  </script>


</body>
